[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archaudit"
version = "1.0.0"
description = "Read-only security & inventory audit for Arch Linux, written as an Obsidian vault"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
archaudit = "archaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF003"]  # asserts in tests; intentional unicode (icons, indents)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/archaudit/collectors/filesystem.py" = ["S108"]  # scans temp dirs, never creates files there

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
